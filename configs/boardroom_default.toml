[experiment]
name = "boardroom_default"
# 旧字段，保留给命令行和 manifest 兼容；现在表示默认最大讨论轮数。
bargaining_rounds = 6
history_limit = 10

[paths]
role_policy_dir = "policies/roles"
prompts_dir = "prompts"

[agents]
role_order = [
  "Founder_CEO",
  "CTO",
  "Lead_VC_Director",
  "Followon_VC_Director",
]

[board]
# 可选值：aunt, barbarian, clan, value_creating。
# archetype 会默认带出 L5 文化层、讨论流程、主导模式、挑战要求、记忆范围和角色权重乘数。
archetype = "value_creating"

# 如需覆盖 archetype 的默认 L5 文化层，可取消注释并只改需要的维度。
# [board.culture]
# criticality = 0.75
# creativity = 0.70
# cohesiveness = 0.70
# openness_generosity = 0.80
# preparation_involvement = 0.85
#
# 如需覆盖 archetype 的默认角色影响力乘数，可取消注释。
# [board.role_weight_multipliers]
# Founder_CEO = 1.0
# CTO = 1.0
# Lead_VC_Director = 1.0
# Followon_VC_Director = 1.0

[discussion]
paradigm = "memory"
response_generator = "critical"
# 董事会讨论不再固定三轮。模拟会至少跑 min_rounds，最多跑 max_rounds；
# 每轮后根据共识、观点变化和开放问题判断是否继续。
min_rounds = 2
max_rounds = 6
stop_when_consensus_score_gte = 0.82
stop_when_no_role_changes_for_rounds = 1
stop_when_no_open_questions = true
# protocol、dominance_pattern、challenge_required、memory_scope、memory_window
# 默认由 board.archetype 决定；只在做消融实验时显式覆盖。
round_tasks = [
  "第 1 轮：按当前会议阶段暴露你的角色立场、核心证据锚点和对当前融资路径的第一反应。",
  "第 2 轮：澄清关键事实假设，指出当前提案中最需要验证的数据、估值或执行风险。",
  "第 3 轮：回应此前至少一条具体观点，提出质询、替代融资情境或条款修正，并说明它对角色立场的影响。",
  "第 4 轮：围绕替代方案、保护条款、融资规模或估值路径进行建设性修正。",
  "第 5 轮：整合争议，说明你采纳、拒绝或保留了哪些观点，以及结构化预测为何变化或不变。",
  "第 6 轮：形成该角色愿意支持、反对、保留或要求修改的最终会议立场，并同步内部预测。",
]

[decision]
protocol = "weighted_vote"

[decision.weights]
Founder_CEO = 2.0
CTO = 0.5
Lead_VC_Director = 3.0
Followon_VC_Director = 1.5
